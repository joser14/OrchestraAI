<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Orchestra setup</title>
<style>
  :root { color-scheme: dark; --bg: #070505; --panel: #120b0c; --text: #f3e9ea; --muted: #a3898c; --border: #2e1a1d; --red: #ff2d3d; --ok: #ff8f80; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(700px 400px at 50% 0%, rgba(255,45,61,.14), transparent 70%), var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { width: min(640px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  h1 { margin: 0 0 4px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  h1 span { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, #ff2d3d, #8b0a1a); font-size: 18px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  ul { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
  li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; }
  li .why { color: var(--muted); font-size: 12px; }
  li .st { font-size: 12px; color: var(--muted); }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); }
  li.ok .dot { background: var(--ok); border-color: var(--ok); }
  li.ok .st { color: var(--ok); }
  li.run { border-color: var(--red); }
  li.run .dot { border-color: var(--red); border-top-color: transparent; animation: spin .8s linear infinite; }
  li.fail .dot { background: var(--red); border-color: var(--red); }
  li.fail .st { color: var(--red); }
  @keyframes spin { to { transform: rotate(360deg); } }
  pre { margin: 0; height: 150px; overflow: auto; background: #000; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: 11.5px/1.45 ui-monospace, Consolas, monospace; color: var(--muted); white-space: pre-wrap; }
  @media (prefers-reduced-motion: reduce) { li.run .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <h1><span>&#9835;</span>Setting up Orchestra</h1>
  <p class="sub" id="sub">Installing what this PC is missing. Windows may ask for permission along the way.</p>
  <ul id="list"></ul>
  <pre id="log"></pre>
</main>
<script>
  // Filled by the desktop shell (main.cjs) through executeJavaScript: update({ items, sub }) and log(line).
  function update(s) {
    if (s.sub) document.getElementById('sub').textContent = s.sub;
    const list = document.getElementById('list'); list.replaceChildren();
    for (const it of s.items) {
      const li = document.createElement('li'); li.className = it.state;
      const dot = document.createElement('i'); dot.className = 'dot';
      const txt = document.createElement('div'); const b = document.createElement('b'); b.textContent = it.name;
      const why = document.createElement('div'); why.className = 'why'; why.textContent = it.why; txt.append(b, why);
      const st = document.createElement('span'); st.className = 'st'; st.textContent = it.status;
      li.append(dot, txt, st); list.append(li);
    }
  }
  function log(line) { const p = document.getElementById('log'); p.textContent += line + '\n'; p.scrollTop = p.scrollHeight; }
</script>
</body>
</html>
